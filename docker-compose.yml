version: '3.8'

# =====================================================================
# PERSONAL FITNESS LOGBOOK - PRODUCTION DOCKER COMPOSE
# Ottimizzato per VPS S (1 vCore CPU, 2 GB RAM, AlmaLinux 9)
# Budget RAM Complessivo Sandbox: < 480 MB (Hard Limit)
# =====================================================================

services:
  # -------------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 Alpine
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitness_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_secure_password_here}
    volumes:
      # Named volume esplicito per proteggere i dati da 'docker compose down'
      - fitness_postgres_data:/var/lib/postgresql/data
      # Configurazione custom per mantenere la RAM < 150 MB
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 180M
        reservations:
          memory: 80M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitness_user} -d ${POSTGRES_DB:-fitness_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 2. BACKEND API: Node.js (TypeScript + Fastify + Drizzle ORM)
  # -------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_REPO_OWNER:-lorenzoanzivino}/personal-fitness-logbook-backend:latest
    container_name: fitness-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Limita l'heap V8 di Node.js per impedire leak oltre 192 MB
      NODE_OPTIONS: "--max-old-space-size=192"
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-fitness_user}:${POSTGRES_PASSWORD:-fitness_secure_password_here}@db:5432/${POSTGRES_DB:-fitness_db}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_a_secure_random_string_in_production}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Volume persistente per i PDF dei piani nutrizionali caricati
      - fitness_uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.70'
          memory: 250M
        reservations:
          memory: 100M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8000:8000"
    expose:
      - "8000"
    networks:
      - backend-net

  # -------------------------------------------------------------------
  # 3. REVERSE PROXY: Nginx Alpine (SSL Let's Encrypt / Gzip / Rate Limit)
  # -------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: fitness-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - fitness_certbot_data:/etc/letsencrypt
      - fitness_certbot_www:/var/www/certbot
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 50M
        reservations:
          memory: 15M
    depends_on:
      - api
    networks:
      - backend-net

# =====================================================================
# VOLUMI PERSISTENTI (PROTETTI DALLA DISTRUZIONE DEI CONTAINER)
# =====================================================================
volumes:
  fitness_postgres_data:
    name: fitness_postgres_data
    driver: local
  fitness_uploads_data:
    name: fitness_uploads_data
    driver: local
  fitness_certbot_data:
    name: fitness_certbot_data
    driver: local
  fitness_certbot_www:
    name: fitness_certbot_www
    driver: local

# =====================================================================
# RETE PRIVATA ISOLATA
# =====================================================================
networks:
  backend-net:
    driver: bridge
