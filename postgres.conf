# =====================================================================
# TUNING POSTGRESQL 16 PER VPS S (1 vCore, 2 GB RAM, AlmaLinux 9)
# Obiettivo: Footprint di memoria stabile < 150 MB (tipico: ~85-110 MB)
# =====================================================================

# ---------------------------------------------------------------------
# CONNESSIONI & RETE
# ---------------------------------------------------------------------
max_connections = 25
superuser_reserved_connections = 3
listen_addresses = '*'

# ---------------------------------------------------------------------
# GESTIONE MEMORIA & BUFFER CACHE
# ---------------------------------------------------------------------
# shared_buffers: allocato all'avvio (~3-4% della RAM totale dell'host)
shared_buffers = 64MB

# effective_cache_size: stima per il query planner (non alloca memoria reale)
effective_cache_size = 192MB

# work_mem: allocato per singola operazione di sort/hash per connessione
work_mem = 4MB

# maintenance_work_mem: usato per VACUUM, CREATE INDEX, ALTER TABLE
maintenance_work_mem = 16MB

# ---------------------------------------------------------------------
# WRITE-AHEAD LOGGING (WAL) & DISCO NVMe
# ---------------------------------------------------------------------
wal_buffers = 2MB
min_wal_size = 32MB
max_wal_size = 256MB
checkpoint_completion_target = 0.9

# Costo I/O ottimizzato per storage NVMe SSD ultra-veloce
random_page_cost = 1.1
effective_io_concurrency = 100
default_statistics_target = 50

# ---------------------------------------------------------------------
# LOGGING ESSENZIALE (Anti-saturazione disco 60 GB)
# ---------------------------------------------------------------------
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 500
log_timezone = 'UTC'
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
