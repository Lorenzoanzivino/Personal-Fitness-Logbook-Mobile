# =====================================================================
# NGINX REVERSE PROXY CONFIGURATION
# Ottimizzato per Fastify API su VPS 2GB RAM
# =====================================================================

# Rate Limiting Zone: 10 richieste al secondo per IP con burst consentito
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge per il rinnovo automatico certificati Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Dimensione massima upload (permettere upload PDF diete fino a 25MB)
    client_max_body_size 25M;

    # Compressione Gzip per ridurre il consumo di banda da mobile
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;

    # Proxy verso il backend Fastify
    location / {
        # Applicazione del rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        
        # Headers per inoltro identità client e SSL
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout protettivi
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
